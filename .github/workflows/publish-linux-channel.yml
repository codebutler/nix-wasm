name: publish-linux-channel

# Republish the versioned `linux` guest channel pc resolves at runtime
# (packages/linux/latest.json). Build both boot bundles (.#linux-image and
# .#linux-image-nommu) + the shared toolchain cache (.#wasm-binary-cache),
# upload them under immutable versions, then flip latest.json — see
# scripts/publish-linux-channel.sh and
# vendor/linux-wasm/SOURCE.md §"Republish the guest".
#
# Deliberate release only — never on push. Two equivalent kicks:
#   workflow_dispatch (Actions UI / `gh workflow run`) with optional dry_run
#   repository_dispatch type `publish-linux-channel` (integrations with
#   contents:write but not actions:write — same live publish, dry_run false)
#
# PRECONDITION (#123): nix-wasm.yml's `artifacts` job must have COMPLETED on this
# commit — it pushes both linux-image outputs + .#wasm-binary-cache to Cachix. The publish
# script's artifact-provenance gate checks that in seconds and fails fast
# otherwise, so a publish dispatched against an in-flight or cancelled artifacts
# run can no longer build a locally-made image and ship it green (#121).
# `dry_run: true` runs the gate too — use it to check the coast is clear.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + print the wrangler commands, but upload nothing"
        type: boolean
        default: false
      allow_unpublished:
        description: "DANGER: publish even if CI has not built these artifacts (builds them here, takes hours)"
        type: boolean
        default: false
      reuse_live_nix_cache:
        description: "Publish new system images while retaining the currently-live compiler catalog"
        type: boolean
        default: false
  repository_dispatch:
    types: [publish-linux-channel]

# Serialize channel writes so two dispatches can't interleave the latest.json flip.
concurrency:
  group: publish-linux-channel
  cancel-in-progress: false

# The ARM64 Lima runner executes x86_64 Nix outputs through Rosetta.
env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    system = x86_64-linux
    extra-platforms = x86_64-linux
  NIX_PATH: nixpkgs=channel:nixos-26.05

jobs:
  publish:
    # Dedicated Lima/Rosetta runner configured for x86_64 Nix: the publish normally
    # substitutes CI-built paths, but the full image and binary-cache closure
    # still need substantial disk and RAM. Keep its architecture aligned with
    # nix-wasm.yml so the provenance gate checks the same store paths.
    runs-on: [self-hosted, linux, ARM64, nix-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Disk free
        run: df -h /

      # Nix is preinstalled in this isolated VM so its validated x86 store
      # persists across trusted release jobs. Reinstalling would conflict with
      # its single-user /nix store.
      - name: Verify preinstalled x86 Nix
        run: test "$(nix eval --raw --impure --expr builtins.currentSystem)" = x86_64-linux

      - uses: cachix/cachix-action@v15
        with:
          name: nix-wasm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # wrangler needs Node >= 22; the previous runner shipped v20 by default
      # (matches the deploy-preview-worker.yml fix, #72). Without this `bunx
      # wrangler` refuses to run and the publish silently no-ops.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun so `bunx wrangler` is available in the publish script.
      - uses: oven-sh/setup-bun@v2

      # linux.iso goes up via rclone (it outgrew wrangler's 300 MiB cap), but
      # rclone is NOT preinstalled on the runner -- the publish died with
      # "rclone: command not found" (exit 127) right at the upload. Same
      # provisioning step pr-preview.yml already uses for its own rclone sync.
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Build + publish the linux channel to R2
        env:
          # DRY_RUN=true → the script builds + prints but uploads nothing.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          # #123 escape hatch. Defaults false, and repository_dispatch can never
          # set it — an automated kick must not be able to opt out of the gate.
          ALLOW_UNPUBLISHED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unpublished || false }}
          # System images and the optional in-guest compiler catalog have
          # independent release cadences. This keeps the last known-good catalog
          # while still enforcing CI provenance for all four new images.
          REUSE_LIVE_NIX_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_live_nix_cache || false }}
          # Mirrors nix-wasm.yml's "Push wasm-tools .drv closures to Cachix" step,
          # which is `if: github.ref == 'refs/heads/master'`. Off master CI never
          # pushes them by design, so requiring them there would make every branch
          # publish unsatisfiable; on master they are part of a complete channel.
          REQUIRE_DRV_ROOTS: ${{ github.ref == 'refs/heads/master' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # linux.iso goes up via rclone (it is ~340 MiB; `wrangler r2 object
          # put` caps at 300 MiB), which needs an R2 API token's S3 keys — a
          # DIFFERENT credential from CLOUDFLARE_API_TOKEN, which carries no r2
          # scope. Same secrets pr-preview.yml already uses for its rclone sync.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Optional, and PREFERRED if set: S3 keys scoped to the packages
          # bucket. The R2_* pair above is scoped to the PREVIEW bucket
          # (pr-preview.yml's sync) and cannot write pc-packages. Absent these,
          # the script derives S3 creds from CLOUDFLARE_API_TOKEN, which does
          # have access (wrangler writes the catalogs and pointer with it).
          R2_PACKAGES_ACCESS_KEY_ID: ${{ secrets.R2_PACKAGES_ACCESS_KEY_ID }}
          R2_PACKAGES_SECRET_ACCESS_KEY: ${{ secrets.R2_PACKAGES_SECRET_ACCESS_KEY }}
        # pipefail so the script's exit code propagates through `tee` — without it
        # a failed publish (e.g. the verify's `exit 1`) is masked by tee's 0 and the
        # job goes green despite publishing nothing.
        run: |
          set -o pipefail
          bash scripts/publish-linux-channel.sh | tee -a "$GITHUB_STEP_SUMMARY"

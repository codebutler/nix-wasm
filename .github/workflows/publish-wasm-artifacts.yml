name: publish-wasm-artifacts

on:
  push:
    branches: [master]
  workflow_dispatch:

# The ARM64 Lima runner executes x86_64 Nix outputs through Rosetta.
env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    system = x86_64-linux
    extra-platforms = x86_64-linux
  NIX_PATH: nixpkgs=channel:nixos-26.05

jobs:
  publish:
    # Dedicated Lima/Rosetta runner — substitutes the closure from Cachix and
    # uploads to R2. cache.nixos.org still serves the native deps.
    runs-on: [self-hosted, linux, ARM64, nix-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Disk free
        run: df -h /

      # Nix is preinstalled in this isolated VM so its validated x86 store
      # persists across trusted release jobs. Reinstalling would conflict with
      # its single-user /nix store.
      - name: Verify preinstalled x86 Nix
        run: test "$(nix eval --raw --impure --expr builtins.currentSystem)" = x86_64-linux

      - uses: cachix/cachix-action@v15
        with:
          name: nix-wasm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # Wrangler requires Node >= 22. Self-hosted runners may expose Node 20 to
      # shell steps even though GitHub-hosted JavaScript actions themselves are
      # forced onto Node 24, so install a supported shell-visible runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install bun so `bunx wrangler` is available in publish-to-r2.sh.
      - uses: oven-sh/setup-bun@v2

      - name: Build wasm artifacts + publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # publish-to-r2.sh prints bytes/sha256/version to stdout; tee appends to
        # the step summary so the values are visible in the Actions UI for the
        # pc registry.js bump (see docs/superpowers/notes/deploy-r2.md).
        # Preserve the publisher's failure through tee. Without pipefail,
        # Wrangler can reject every upload while tee exits 0 and marks the job
        # green despite publishing nothing.
        run: |
          set -o pipefail
          bash scripts/publish-to-r2.sh | tee -a "$GITHUB_STEP_SUMMARY"

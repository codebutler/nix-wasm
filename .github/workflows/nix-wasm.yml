name: nix-wasm

# Phase 5 (#2): build every wasm artifact from source on x86_64-linux and push the
# results to the nix-wasm Cachix cache. This is the binary-cache backend decision
# from the issue ("CI host + cache backend"): Cachix is the Nix *store* cache —
# a substituter (warm reruns + the guest pulling prebuilt wasm) AND a push target
# (every store path realised in a job is uploaded). It is content-addressed by
# store-path hash, so there is no manual cache-key bookkeeping: a flake.lock or
# patches/ change moves the hashes and self-invalidates.
#
# The two from-source LLVM builds (guest-clang and the kernel's patched LLVM,
# ~1-2h each cold) are the long pole. They run on their own runners in the
# `toolchain` matrix so each stays under the 6h hosted-runner job limit and the
# two LLVMs compile in parallel; the cheaper `artifacts` job then SUBSTITUTES them
# from Cachix instead of rebuilding. A cold cache pays the full LLVM rebuild once;
# every run after substitutes in minutes.
#
# Cache backend: nix-wasm.cachix.org (public read; signing key
# nix-wasm.cachix.org-1:UlXbCihIfmQnzcyTQuRutvD0IPVVoHHAoIamxBJZUb0=). Pushing
# requires the CACHIX_AUTH_TOKEN repo secret; without it (e.g. fork PRs) the jobs
# still substitute from the public cache, they just don't push.

on:
  push:
    branches: [master, 'claude/**']
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '**/*.nix'
      - 'patches/**'
      # scripts/*.py are real build inputs of several .nix derivations
      # (busybox-fork.nix's wasm-check-imports.py post-link check,
      # guest-clang.nix's wasm-check-exports.py, the spawn-contract sweep
      # driver — nix-wasm#202 PR-1) — a script-only change is a derivation
      # build-input change and must trigger the workflow at all, not just be
      # visible to the `changes` job's dorny/paths-filter once triggered by
      # something else (that filter already listed it below; without this
      # top-level entry the workflow never runs for a scripts-only push, so
      # the filter is unreachable — nix-wasm#202, found by review).
      - 'scripts/**'
      # The boot-smoke / nix-boot-smoke jobs run the runtime engine + the
      # demo/node smoke scripts, so a change to either must re-validate them
      # (kernel/toolchain substitute from Cachix when their inputs are unchanged).
      - 'runtime/**'
      - '.rebuild-request'
      - '.github/workflows/nix-wasm.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '**/*.nix'
      - 'patches/**'
      - 'scripts/**'
      - 'runtime/**'
      - '.github/workflows/nix-wasm.yml'
  workflow_dispatch:

concurrency:
  # Key on the HEAD BRANCH NAME, not github.ref: github.ref is refs/heads/<branch>
  # for push but refs/pull/<N>/merge for pull_request, so the push-event (claude/**)
  # and pull_request-event runs of the SAME commit used to land in different groups
  # and BOTH ran — double-building the whole wasm world per PR push. The branch-name
  # key shares one group so the duplicate self-cancels (same fix as ci.yml in pc).
  group: nix-wasm-${{ github.event.pull_request.head.ref || github.ref_name }}
  # Supersede an in-flight run on a newer push. Safe for a cache-populating build:
  # cachix-action pushes each derivation as it finishes (post-build-hook), so a
  # cancelled run's completed paths are already in Cachix and the new run just
  # substitutes them — no lost work, no double-building the slow poles.
  cancel-in-progress: true

jobs:
  # --- decouple runtime-only changes from the world rebuild ---------------------
  # This workflow triggers on both *.nix/patches (the wasm world) AND runtime/**
  # (the JS engine, because the boot smokes run it). But the toolchain/artifacts
  # BUILD jobs don't depend on runtime/ at all — a pure engine-JS change used to
  # still spin up the nix-heavy LLVM runners and re-run the whole build path. This
  # filter splits the two: `nix` gates the from-source build jobs; `runtime` (or
  # `nix`) gates the boot smokes, which substitute the unchanged kernel/artifacts
  # from Cachix instead of waiting on a rebuild.
  changes:
    runs-on: namespace-profile-xs
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - '**/*.nix'
              - 'patches/**'
              - '.rebuild-request'
              - '.github/workflows/nix-wasm.yml'
              # nix-wasm#202 PR-1: several .nix derivations interpolate a
              # scripts/*.py path directly into their build (busybox-fork.nix's
              # wasm-check-imports.py post-link check; guest-clang.nix's
              # wasm-check-exports.py; the new spawn-contract sweep driver) —
              # a script-only change is a real build-input change there, so it
              # must trigger the SAME jobs a .nix change does (this was already
              # true before this PR for wasm-check-exports.py/wasm-strip-
              # export.py; the filter just never covered it). This ONLY works
              # because `scripts/**` is ALSO listed in the top-level
              # `on.push.paths`/`on.pull_request.paths` above — those gate
              # whether this workflow (and hence this very `changes` job) runs
              # AT ALL, so a filter entry here with no matching top-level entry
              # would be unreachable dead code for a scripts-only commit (the
              # workflow would simply never start). Found missing at the
              # top level by review (nix-wasm#202) and added there in the same
              # change as this comment — keep both lists in sync if either
              # changes.
              - 'scripts/**'
            runtime:
              - 'runtime/**'

  # --- the heavy from-source LLVM builds, one runner each, pushed to Cachix ----
  toolchain:
    name: build .#${{ matrix.attr }}
    needs: changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    # Namespace `lg` runner (16 vCPU / 32 GB, x86_64). The from-source LLVM poles
    # (guest-clang, the kernel's patched LLVM) are RAM/core-bound — they time out
    # on a stock 4-core/16 GB ubuntu-latest (kernel hit the 6h cap). `lg` gives the
    # cores/RAM/disk to land each in ~1-2h. cache.nixos.org still has the full
    # nixos-26.05 x86_64 cache for the native deps. (This is the sole heavy build;
    # everything else runs on the smaller xs/sm/md t-shirt pools — see the other
    # jobs.)
    runs-on: namespace-profile-lg
    timeout-minutes: 350 # headroom under the 6h job limit; warm reruns substitute from Cachix
    strategy:
      fail-fast: false
      matrix:
        attr: [guest-clang, kernel]
    steps:
      - uses: actions/checkout@v4

      # Namespace profiles provision ample disk, so the ubuntu-latest preinstalled-
      # toolchain reclaim hack isn't needed here — just record free space.
      - name: Disk free
        run: df -h /

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: nix-wasm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build .#${{ matrix.attr }}
        run: nix build -L --keep-going '.#${{ matrix.attr }}' --print-out-paths --no-link

  # --- the substitutable artifact set: reuses the cached toolchain via Cachix ---
  artifacts:
    name: build wasm artifacts
    needs: [changes, toolchain]
    if: ${{ needs.changes.outputs.nix == 'true' }}
    # Namespace small runner: with the toolchain + cross closure cached in Cachix,
    # this job is substitution-only (I/O-bound) plus the cheap top layer (nix.wasm
    # C++ + squashfs/initramfs/image), so the default profile suffices. (Use
    # nix-heavy for the FIRST cold run that has to compile the whole cross closure
    # from source.) Stays off GitHub-hosted minutes (private repo).
    runs-on: namespace-profile-md
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Disk free
        run: df -h /

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: nix-wasm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # guest-clang/kernel now substitute from Cachix (pushed by the toolchain
      # job); the rest builds on top. wl-eyes is vendored into the repo (#62/#63),
      # so the initramfs and the full linux-image boot bundle build in CI too.
      - name: Build substitutable artifacts
        # tee to build.log: on failure the step below surfaces the error tail as
        # a PR comment — the raw job-log tail is unreachable through the API
        # (the Cachix post-job scan floods the last ~30k lines).
        run: |
          set -o pipefail
          nix build -L --keep-going \
            '.#nix-wasm' \
            '.#nix-wasm-nommu' \
            '.#wasm-binary-cache' \
            '.#wasm-base-squashfs' \
            '.#wasm-base-squashfs-nommu' \
            '.#wasm-base-squashfs-fork' \
            '.#wasm-initramfs' \
            '.#wasm-initramfs-nommu' \
            '.#wasm-initramfs-fork' \
            '.#linux-image' \
            '.#kernel-nommu' \
            '.#kernel-mmu' \
            '.#kernel-mmu-a2' \
            '.#mmu-init' \
            '.#mmu-init-a2' \
            '.#fork-init' \
            '.#fork-exec-init' \
            '.#exec-child' \
            '.#grandfork-init' \
            '.#grandfork-child' \
            '.#deepfork-init' \
            '.#deepfork-child' \
            '.#deepfork-exec-init' \
            '.#deepfork-sig-child' \
            '.#userspace-busybox-fork' \
            '.#spawn-linkcheck' \
            '.#musl-fork-linkcheck' \
            --print-out-paths --no-link 2>&1 | tee build.log

      # `nix-env -iA wasm-tools.<tool>` (the static pkgs.nix catalog) SUBSTITUTES
      # the .drv (then the output). cachix-action's post-build-hook pushes only
      # built OUTPUTS, so the toolchain .drv closures never reach Cachix on their
      # own — push them explicitly so the guest, which now substitutes from
      # nix-wasm.cachix.org over the Wisp uplink (exactly like real NixOS), can
      # resolve them. Master-only: fork PRs lack the push token, and only the
      # channel the live guest boots from needs a complete cache. (Real NixOS
      # never needs this — it instantiates .drvs locally from nixpkgs; the
      # `nixpkgs.<pkg>` path here does too and needs only the already-pushed
      # output. This backs solely the nix-wasm-specific static catalog.)
      - name: Push wasm-tools .drv closures to Cachix
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          roots=$(nix build -L '.#wasm-cache-drv-roots' --no-link --print-out-paths)
          while IFS= read -r drv; do
            [ -n "$drv" ] || continue
            echo "cachix push (drv): $drv"
            cachix push nix-wasm "$drv"
          done < "$roots"

      # Failure forensics: the interesting nix error is buried mid-log behind
      # the Cachix post-job flood, out of reach of API log tails. Post the
      # error tail straight onto the PR so it's readable (and webhook-visible).
      - name: Surface build failure on the PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch {}
            const lines = log.split('\n');
            // Prefer the nix error blocks; fall back to the raw tail.
            const errIdx = [];
            lines.forEach((l, i) => { if (/error: builder for|error: build of|configure: error|Error [0-9]+$/.test(l)) errIdx.push(i); });
            let picked;
            if (errIdx.length) {
              const set = new Set();
              for (const i of errIdx) for (let j = Math.max(0, i - 40); j <= Math.min(lines.length - 1, i + 5); j++) set.add(j);
              picked = [...set].sort((a, b) => a - b).map((i) => lines[i]);
            } else {
              picked = lines.slice(-120);
            }
            const body = ['<!-- nix-build-failure -->', '❌ **`build wasm artifacts` failed** — nix error tail:', '', '```', ...picked.slice(-160), '```'].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body.startsWith('<!-- nix-build-failure -->'));
            if (mine) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

      # Acceptance #2 (determinism): a forced rebuild of nix.wasm must reproduce
      # the same output. --rebuild rebuilds just the top derivation and compares.
      # This recompiles nix.wasm's C++ a SECOND time, so it's off the PR critical
      # path — run it on master/dispatch only, not on every PR push.
      - name: Determinism check (.#nix-wasm --rebuild)
        if: github.event_name != 'pull_request'
        run: nix build -L --rebuild '.#nix-wasm' --no-link

  # --- contract: the spawn-contract gate (nix-wasm#202 PR-1) ------------------
  # Guards the promoted fork-capable libc default — see
  # scripts/wasm-check-imports.py's module docstring for the
  # capture_stack/asyncify-TypeError mechanism this whole gate exists to catch
  # at BUILD time instead of at boot. Substitutes everything it
  # needs (the cross cc-wrapper, musl-fork, busybox-fork, nix-wasm-fork, and
  # every extraBin/systemPackage app) from Cachix once `toolchain`/`artifacts`
  # have pushed them, so this stays a cheap, no-boot job — no runtime/ harness,
  # no vmlinux.wasm execution, just `nix build` on four check derivations:
  #   • spawn-linkcheck / spawn-linkcheck-fork (spikes/spawn-contract/check.nix)
  #     — the two-probe (fork()/posix_spawn()) LINK contract, one per profile.
  #   • guest-spawn-contract-nommu / guest-spawn-contract-fork
  #     (userspace/spawn-contract-sweep.nix) — the closure-wide sweep asserting
  #     every shipped wasm module obeys the capture_stack/asyncify-ABI contract
  #     for its profile, with the MEASURED capture_stack-importer count pinned
  #     (0 / 2 respectively — see flake.nix's own comments on
  #     guestSpawnContractNommu/guestSpawnContractFork for how that was measured).
  contract:
    name: spawn-contract gate
    needs: [changes, artifacts]
    # Same "world changed OR just the engine did" condition as boot-smoke below
    # (this job never touches runtime/, but artifacts' own outputs are what it
    # substitutes, so it should still run whenever artifacts did) — except this
    # gate has nothing to do with the engine, so it only needs to run when the
    # nix world itself changed.
    if: ${{ needs.changes.outputs.nix == 'true' && !failure() && !cancelled() }}
    # md, not xs (review finding): the two guest-spawn-contract-* sweeps each
    # closureInfo-REALIZE their whole profile's guest closure (busybox/nix.wasm
    # + every initramfs extraBin + every environment.systemPackages app +
    # the toolchain/nixpkgs catalog, ~1-2GB) to enumerate store-paths — that
    # substitution itself is cheap I/O xs could handle. The actual pressure is
    # scripts/wasm-closure-sweep.py's own peak RSS: a prior revision held every
    # swept module's FULL BYTES in memory at once (sorting a list of
    # (path, data) tuples) rather than sorting paths and re-reading each
    # module's bytes one at a time inside the check loop — measured at 2.23 GB
    # of distinct wasm modules across the cross outputs in a real store
    # (nix-wasm#202, found by review). The sweep script was fixed to read
    # paths-only + stream module bytes one file at a time, which lowers that
    # peak substantially, but md is kept regardless as headroom for the
    # closureInfo realize step itself and any future growth in the swept set.
    runs-on: namespace-profile-md
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Disk free
        run: df -h /

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: nix-wasm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Spawn-contract gate (link probes + closure-wide sweep)
        run: |
          nix build -L --keep-going \
            '.#spawn-linkcheck' \
            '.#spawn-linkcheck-fork' \
            '.#guest-spawn-contract-nommu' \
            '.#guest-spawn-contract-fork' \
            --print-out-paths --no-link

  # --- boot-smoke: actually BOOT the guest and run the in-repo node smokes -----
  # The static gates (runtime-gates.yml) never boot the guest, and the artifacts
  # job above only BUILDS the images. This job substitutes vmlinux.wasm +
  # initramfs.cpio.gz from Cachix and boots them in the Node harness to run the
  # #35 async-signal regression/diagnostic smokes end to end:
  #   • sigalrm-smoke   — the kernel self-armed SIGALRM/itimer/alarm path (#55).
  #   • kill-wake-smoke — the cross-process kill() async-signal wake reproducer
  #     for the `timeout 2 sleep 10` hang (#35), no busybox/networking.
  #   • ping-pace-smoke — #75 regression (GATING; fixed by patches/kernel/0021):
  #     a one-shot SIGALRM handler installed with SA_RESTART (busybox ping via
  #     signal()) must run when it interrupts a blocking syscall. No networking.
  #   • ping-pace-probe-smoke — #75 localizer (non-gating): control/restart/xcpu/
  #     repro/transparent matrix, the detailed breakdown behind ping-pace-smoke.
  #   • vsock-ctl-smoke — the guest /Ctl agent (yorectl) ↔ host listener over
  #     virtio-vsock, open/notify/clipset/clipget round-trip (issue #60 Phase 2).
  #   • resize-smoke   — terminal resize: console.resize() → virtio-console
  #     config-change irq → hvc_resize(), read back via `stty size` (#83 follow-up).
  # A nix:false boot needs only the kernel + initramfs (no squashfs/nix-cache),
  # so this stays a light substitute-and-run job. Each smoke exits 2 on a boot
  # panic (inconclusive) and is retried; 0 pass / 1 fail are terminal.
  #
  # `mmu-devices` (#131 prove-then-flip) re-boots the SAME device/async-signal
  # smokes above against .#kernel-mmu-a2 + .#wasm-initramfs-fork instead of the
  # NOMMU .#kernel the `signals` shard boots. Every one of those smokes was
  # diagnosed and fixed against NOMMU only, and this really is a different
  # kernel build to re-run them on — but NOT because the KERNEL itself gets
  # translated. Patch 0023 is explicit that it does not: "the kernel runs in
  # physical/identity space (it is NOT instrumented); only instrumented USER
  # code translates". Virtio rings are host-side raw WebAssembly.Memory byte
  # offsets either way (runtime/virtio/vring.js), walked by that same
  # uninstrumented kernel code on both the NOMMU and MMU kernels — no ring
  # descriptor ever goes through a "checked walk". What actually differs here:
  # every exec'd USER binary driving these smokes (busybox, the shell) is now
  # softmmu-instrumented at load (kernel-worker.js wasm_load_executable, gated
  # on nonzero pt_base), and every kernel<->user copy for a device's
  # read()/write() payload crosses the kernel's SOFTWARE uaccess table-walk
  # (patch 0023 mm/uaccess.c raw_copy_{to,from}_user + fixup_user_fault)
  # instead of NOMMU's flat linear-memory copy — real new surface, and #168's
  # page-crossing corruption class is the proof that surface CAN silently
  # break, not a hypothetical. That's a SUBSET of issue #11's "virtio under
  # translation" concern, not the whole of it — #11's identity-vring-
  # addressing question is precisely what this software MMU sidesteps by
  # keeping the kernel identity-mapped. See that shard's own step comments for
  # the per-smoke breakdown; all 10 recorded a first-attempt green in PR #184's
  # soak cycle and are GATING since (the #131 soak-flip promotion).
  boot-smoke:
    name: boot guest + signal/device smokes
    needs: [changes, toolchain]
    # Runs when the world changed OR just the engine did (substitutes the kernel
    # from Cachix). `!failure() && !cancelled()` lets it run even when `toolchain`
    # was SKIPPED (runtime-only change) instead of being blocked by the needs edge.
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.nix == 'true' || needs.changes.outputs.runtime == 'true') }}
    runs-on: namespace-profile-md
    # MERGED (CI perf pass): this job used to be a 3-way matrix (signals, mmu,
    # mmu-devices), each its own namespace-profile-md job. Real CI history showed
    # jobs in this wave queueing 30-90+ min for a free `md` runner while the
    # smoke work itself only takes minutes once running — the runner pool, not
    # the boots, was the bottleneck. The three shards boot three DIFFERENT
    # kernel/initramfs pairs, so merging doesn't de-duplicate any Cachix
    # substitution (unlike the nix-boot-smoke*/browser-smoke merges below); the
    # win here is purely cutting 3 simultaneous `md` runner requests down to 1.
    # They were frequently serialized by pool scarcity anyway, so running them
    # sequentially in one job costs little real wall-clock. Budget below is the
    # sum of each former shard's own worst case (signals ~60 min incl. 3x
    # panic-retries, mmu ~90 min across its 6 fork/grandfork/deepfork smokes,
    # mmu-devices' own step keeps its 150-min step-level timeout) plus setup
    # overhead — see that step's own comment for why it keeps a step-level bound
    # even inside a bigger job. Capped at 355 (not the ~320 raw sum) to match
    # this file's existing `toolchain` job precedent of staying under GitHub
    # Actions' 360-min job timeout ceiling — 400 here was a bug (#205 review):
    # a job `timeout-minutes` above 360 makes the value meaningless/invalid
    # rather than actually extending the job's real runtime budget.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Disk free
        run: df -h /

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: nix-wasm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Substitute the two artifacts a busybox-only (nix:false) boot needs.
      # (the `mmu` group below builds its own kernels instead.)
      - name: Build kernel + initramfs (substitute from Cachix)
        run: |
          mkdir -p .artifacts
          ln -sfn "$(nix build -L '.#kernel' --no-link --print-out-paths)/vmlinux.wasm" \
            .artifacts/vmlinux.wasm
          ln -sfn "$(nix build -L '.#wasm-initramfs' --no-link --print-out-paths)/initramfs.cpio.gz" \
            .artifacts/initramfs.cpio.gz
          ls -lL .artifacts

      - name: Install runtime deps
        working-directory: runtime
        run: bun install --frozen-lockfile

      # Run a smoke up to 3 times, treating exit 2 (boot panic) as retryable.
      # NOTE (#83): every smoke below boots busybox-only and reads its shell over
      # hvc0, which now rides the stock virtio-console driver over 8 single-port
      # virtio-console devices (the bespoke hvc_wasm backend is retired). So this
      # job doubles as the primary-console regression gate: if the console's hvc0
      # registration / input / output broke, none of these smokes would reach a
      # prompt. Multi-tty (hvc1+) needs the full-nix inittab (8 getty lines live in
      # base.squashfs, not the initramfs) and is validated on the PR preview boot.
      - name: Boot smokes (sigalrm + kill-wake + timeout + ping-pace #75 + vsock)
        working-directory: runtime
        env:
          LINUX_WASM_ARTIFACTS: file://${{ github.workspace }}/.artifacts/
        run: |
          run_smoke() {
            local script="$1" attempt rc
            for attempt in 1 2 3; do
              echo "::group::$script (attempt $attempt)"
              set +e
              node "$script"
              rc=$?
              set -e
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -eq 2 ]; then
                echo "$script inconclusive (boot panic) — retrying"
                continue
              fi
              return "$rc"
            done
            echo "$script still inconclusive after 3 attempts"
            return 2
          }
          run_smoke demo/node/sigalrm-smoke.mjs
          run_smoke demo/node/kill-wake-smoke.mjs
          # Reduced reproducer (worker #6, xchat-irc-setup epic) for the
          # posix_spawn() parent-static-memory corruption found debugging Xvfb's
          # xkbcomp spawn: a large patterned static array + a same-size heap
          # buffer must survive several posix_spawn() shapes (self-exec,
          # cross-binary exec, Popen()-style file-actions pipe spawn, and
          # repeated spawns against a fragmented heap). See
          # userspace/spawn-canary-test.c. Gating — a regression here is exactly
          # the class of corruption that made real Xvfb unreliable.
          run_smoke demo/node/spawn-canary-smoke.mjs
          # #35 regression: `timeout 2 sleep 10` must terminate sleep (now fixed
          # by patches/busybox/0008). Gating — a regression fails the job.
          run_smoke demo/node/timeout-repro-smoke.mjs

          # #75 regression (now fixed by patches/kernel/0021): busybox-ping's
          # pacing — a one-shot SIGALRM handler installed with SA_RESTART must run
          # when it interrupts a blocking syscall. The kernel delivers the handler
          # at the FOOT and TRANSPARENTLY restarts the syscall (real result, no
          # -EINTR). Gating — a regression (the one-packet-then-hang) fails the job.
          run_smoke demo/node/ping-pace-smoke.mjs

          # #75 LOCALIZER (NON-gating diagnostic). Runs control/restart/xcpu/repro/
          # transparent in one boot and prints the matrix. All PASS with the fix;
          # kept non-gating as the detailed breakdown behind the gating
          # ping-pace-smoke above (tolerant of the guest's "PROBE ?:" label quirk).
          echo "::group::ping-pace-probe matrix (#75 localizer, non-gating)"
          set +e
          node demo/node/ping-pace-probe-smoke.mjs
          set -e
          echo "::endgroup::"

          # Issue #60 Phase 2: the guest /Ctl agent (yorectl) ↔ host listener over
          # virtio-vsock — open/notify/clipset/clipget round-trip. Gating.
          run_smoke demo/node/vsock-ctl-smoke.mjs

          # #83 follow-up: terminal RESIZE. console(0).resize() writes cols/rows
          # to the virtio-console config space and raises the device's
          # config-change irq; the stock driver hvc_resize()s the tty. Proven via
          # `stty size`. Gating — a regression (resize not propagating) fails.
          run_smoke demo/node/resize-smoke.mjs

          # Issue #145: the guest SOUND CARD. virtio-snd (kernel patch 0027,
          # CONFIG_SND_VIRTIO) + cross alsa-lib: alsa-tone plays a deterministic
          # 440Hz sine through snd_pcm_open/set_params/writei/drain; the host
          # device model (runtime/virtio/snd-device.js) must see SET_PARAMS
          # (48k/2ch) + START, receive the full tone on the tx vq, and the PCM
          # prefix must be BIT-EXACT. Gating.
          run_smoke demo/node/snd-smoke.mjs

          # Guest WALL CLOCK (kernel patch 0028): read_persistent_clock64 off the
          # epoch-anchored monotonic import — without it CLOCK_REALTIME boots at
          # the 1970 epoch and TLS certificate validation ("not yet valid", curl
          # 60) kills Cachix substitution. `date +%s` in-guest must be within
          # 15 min of the host clock. Gating.
          run_smoke demo/node/clock-smoke.mjs
          # #179 hardening: an exec'd image the HOST cannot run must kill only that
          # task, never panic the kernel. Before the fix the softmmu pass's refusal
          # threw out of wasm_load_executable, surfaced contextless from the promise
          # chain via raise_exception() and made_task_dead() PANICKED the guest —
          # one unsupported user binary took down the system. The fixture is a real
          # guest program with the __get_tls_base export stripped
          # (userspace/exec-reject-test.nix). On THIS (NOMMU) kernel there is no
          # instrumentation, so the stripped binary just runs; the gate here is the
          # conforming twin + "no panic" + "shell still alive". `boot-smoke`'s
          # `mmu-devices` shard runs this same smoke on .#kernel-mmu-a2, where
          # the rejection actually happens. Gating.
          run_smoke demo/node/exec-reject-smoke.mjs

          # #177 G1/G3: RW virtio-blk (/dev/vdb) + ext2 mkfs/mount + saveDisk
          # CBHD + reboot readback. Gating — a regression (NOMMU block FS or
          # dirty-journal coherency) fails the job.
          run_smoke demo/node/blk-rw-smoke.mjs

      # #128 Track A software MMU: boot a softmmu-instrumented init under the
      # CONFIG_MMU=y kernel and prove the per-access translate works. A1 (no
      # present check, pages populated at exec) checksums bit-exact; A2 (checked
      # translate, VM_LOCKED/populate dropped) demand-pages an 8 MiB mmap + grows
      # the stack via the __wasm_mmu_fault path. Both substitute their kernels
      # (.#kernel-mmu / .#kernel-mmu-a2) + inits (.#mmu-init / .#mmu-init-a2)
      # from Cachix; the smokes instrument the init at runtime and boot nix:false.
      - name: MMU smokes (#128 software MMU — A1 checksum + A2 demand paging)
        working-directory: runtime
        run: |
          run_smoke() {
            local script="$1"; shift
            local attempt rc
            for attempt in 1 2 3; do
              echo "::group::$script (attempt $attempt)"
              set +e
              env "$@" node "$script"
              rc=$?
              set -e
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -eq 2 ]; then
                echo "$script inconclusive (boot panic) — retrying"; continue
              fi
              return "$rc"
            done
            echo "$script still inconclusive after 3 attempts"; return 2
          }
          A1K="$(cd .. && nix build -L '.#kernel-mmu' --no-link --print-out-paths)"
          A1I="$(cd .. && nix build -L '.#mmu-init' --no-link --print-out-paths)"
          A2K="$(cd .. && nix build -L '.#kernel-mmu-a2' --no-link --print-out-paths)"
          A2I="$(cd .. && nix build -L '.#mmu-init-a2' --no-link --print-out-paths)"
          # A1: fast-path translate, bit-exact checksum. Gating.
          run_smoke demo/node/mmu-smoke.mjs \
            MMU_VMLINUX="$A1K/vmlinux.wasm" MMU_INIT="$A1I/bin/mmu-init"
          # A2: present-checked translate, demand paging + stack growth. Gating.
          run_smoke demo/node/mmu-smoke-a2.mjs \
            MMU_VMLINUX="$A2K/vmlinux.wasm" MMU_INIT="$A2I/bin/mmu-init-a2"
          # #129 Track B: REAL fork() on the software MMU — fork() returns twice
          # (parent pid + child 0) with COW-isolated memory, under .#kernel-mmu-a2
          # (patch 0026) + the asyncify-seam .#fork-init (muslFork 0010). Gating.
          FORKI="$(cd .. && nix build -L '.#fork-init' --no-link --print-out-paths)"
          run_smoke demo/node/fork-smoke.mjs \
            MMU_VMLINUX="$A2K/vmlinux.wasm" FORK_INIT="$FORKI/bin/fork-init"
          # #131/#129: fork + EXEC + wait (what busybox init does) — the child
          # execve()s a fresh image, the parent reaps it. RAW binaries, the
          # engine instruments each at load. Gating.
          FEI="$(cd .. && nix build -L '.#fork-exec-init' --no-link --print-out-paths)"
          EC="$(cd .. && nix build -L '.#exec-child' --no-link --print-out-paths)"
          run_smoke demo/node/fork-exec-smoke.mjs \
            MMU_VMLINUX="$A2K/vmlinux.wasm" \
            FORK_EXEC_INIT="$FEI/bin/fork-exec-init" EXEC_CHILD="$EC/bin/exec-child"
          # #131: second-GENERATION fork — a task that was itself fork()+exec()'d
          # then fork()s a grandchild and waits. Proves the engine's fork machinery
          # works from a non-primary (exec'd) task, not just PID 1. Gating.
          GI="$(cd .. && nix build -L '.#grandfork-init' --no-link --print-out-paths)"
          GC="$(cd .. && nix build -L '.#grandfork-child' --no-link --print-out-paths)"
          run_smoke demo/node/grandfork-smoke.mjs \
            MMU_VMLINUX="$A2K/vmlinux.wasm" \
            GRANDFORK_INIT="$GI/bin/grandfork-init" GRANDFORK_CHILD="$GC/bin/grandfork-child"
          # task #5 regression: signal-handler delivery to a deep fork+wait parent.
          # deepfork-sig-child installs a SIGCHLD handler (hush's HUSH_FAST
          # ingredient) — the minimal repro of the musl __libc_handle_signal
          # NULL-page load that silently SIGSEGV-killed the busybox shell on the
          # MMU (harmless-by-luck on NOMMU). Gating.
          DEI="$(cd .. && nix build -L '.#deepfork-exec-init' --no-link --print-out-paths)"
          DSC="$(cd .. && nix build -L '.#deepfork-sig-child' --no-link --print-out-paths)"
          run_smoke demo/node/deepfork-exec-smoke.mjs \
            MMU_VMLINUX="$A2K/vmlinux.wasm" \
            DEEPFORK_EXEC_INIT="$DEI/bin/deepfork-exec-init" \
            DEEPFORK_CHILD="$DSC/bin/deepfork-sig-child"
          # #131 slice 1: the REAL-FORK busybox boots as PID 1, init fork+execs
          # /bin/sh, and the SHELL runs a multi-command script including a forked
          # NON-LAST external command (/bin/date) + SIGCHLD delivery — the full
          # multi-process chain the NOMMU clone-hack could not do under the MMU.
          # Gating.
          BBF="$(cd .. && nix build -L '.#userspace-busybox-fork' --no-link --print-out-paths)"
          run_smoke demo/node/busybox-fork-smoke.mjs \
            MMU_VMLINUX="$A2K/vmlinux.wasm" BUSYBOX_FORK="$BBF/bin"
          # #11 items 2/3 (wl_shm-on-MMU) parity check — the 2026-08-05 parity
          # plan's "Remaining" item, closing the gap the `gtk` shard's
          # display-free `--selftest`s can't reach: no compositor in the Node
          # harness means `gtk_init_check` returns FALSE and `wl_shm` is never
          # allocated. Boots the real-fork busybox + a small bespoke test
          # binary (userspace/wl-shm-test.c) that drives the virtio_wl
          # NEW_ALLOC/anon-inode/SEND-fds sequence directly — no compositor
          # needed — and checks the host device model's resolution via a
          # `wayland.sendOut` bridge hook (already-shipped API, no engine
          # change). Full design + findings in wl-shm-mmu-smoke.mjs's own
          # header. Item 5 (waylandproxyd's mmap+copy resync) is NOT covered —
          # that needs a real compositor boot.
          #
          # GATING (#203 FIXED): all three checks — ITEM2_INODE (per-vfd anon
          # inode), ITEM3_ADDR (the host's pfn->offset resolution), and
          # CONTENT (a guest mmap of the shm vfd reaches the SAME physical
          # page the host's pfn-derived view reads) — now PASS. This used to
          # be a non-gating step: virtwl_vfd_mmap/virtwl_vfd_get_unmapped_area
          # (patches/kernel/0013) were written for NOMMU's do_mmap
          # direct-mapping and had never been given real MMU page-fault
          # semantics, so CONTENT reliably SIGBUS'd (issue #203). Fixed by
          # completing patch 0023's own (until-now partial) CONFIG_MMU port of
          # virtio_wl.c: virtwl_vfd_mmap() now remap_pfn_range()s the vfd's
          # physically-contiguous buffer into the vma (MAP_SHARED only —
          # MAP_PRIVATE is rejected, loudly, since this driver has no
          # struct-page tracking to support real COW and silently mapping it
          # would risk stale/aliased data), and
          # virtwl_vfd_get_unmapped_area()/virtwl_vfd_mmap_capabilities() are
          # NOMMU-only now (the generic mm->get_unmapped_area is correct under
          # a real MMU). Promoted to a hard `run_smoke` gate (retries on
          # rc==2, like every other smoke in this step) — a regression here
          # now fails the job.
          WST="$(cd .. && nix build -L '.#wl-shm-test' --no-link --print-out-paths)"
          run_smoke demo/node/wl-shm-mmu-smoke.mjs \
            MMU_VMLINUX="$A2K/vmlinux.wasm" BUSYBOX_FORK="$BBF/bin" WL_SHM_TEST="$WST/bin/wl-shm-test"

      # mmu-devices group: substitute the software-MMU kernel + fork initramfs
      # (same pair the default nix-boot-smoke boots, but busybox-only — no squashfs/
      # nix-cache needed for any smoke here).
      - name: Build MMU kernel + fork initramfs (substitute from Cachix)
        run: |
          mkdir -p .artifacts-mmu-devices
          ln -sfn "$(nix build -L '.#kernel-mmu-a2' --no-link --print-out-paths)/vmlinux.wasm" \
            .artifacts-mmu-devices/vmlinux.wasm
          ln -sfn "$(nix build -L '.#wasm-initramfs-fork' --no-link --print-out-paths)/initramfs.cpio.gz" \
            .artifacts-mmu-devices/initramfs.cpio.gz
          ls -lL .artifacts-mmu-devices

      # #131 prove-then-flip: the SAME regression/diagnostic smokes the `signals`
      # shard runs on NOMMU, re-booted here on .#kernel-mmu-a2 + the fork
      # initramfs. Nothing about a NOMMU-only pass proves these hold under the
      # software MMU (see the job-header comment above for what "different
      # kernel build" actually means — instrumented USER code + the kernel's
      # software uaccess walk, NOT translated vrings), and there's specific
      # reason to re-check each group:
      #   • sigalrm / kill-wake / timeout-repro / ping-pace(+probe) all exercise
      #     the #75 fix, an entry.S asm FOOT-loop that re-establishes the kernel
      #     C-frame SP and re-invokes the syscall around signal delivery
      #     (patches/kernel/0021). The loop itself is kernel-side (identity,
      #     uninstrumented, same as NOMMU); what's new is the SCHEDULING context
      #     around it — per-task page tables switched on every context switch
      #     (switch_mm → __mmu_set_pt_base, the exact mechanism Track B's fork
      #     work found a real cross-worker pt_base bug in) — and that the
      #     signalled process's OWN memory accesses are now instrumented;
      #     #168's page-crossing corruption class is the proof that "looks
      #     translate-agnostic" isn't something to assume for that side.
      #   • vsock-ctl / resize / snd / blk-rw each drive a different virtio
      #     device model (vsock, console config-change, snd, blk). The ring
      #     descriptors stay raw host-side offsets on this kernel too (see the
      #     job header); what these newly exercise is the kernel's software
      #     uaccess table-walk on every device<->user buffer transfer (patch
      #     0023 mm/uaccess.c) plus the instrumented user binary's own accesses
      #     to those buffers — a SUBSET of issue #11's "virtio under
      #     translation" concern (#60/#83/#145/#177 each fixed their device
      #     against NOMMU only).
      #   • clock-smoke covers read_persistent_clock64 (patch 0028) unmodified —
      #     no MMU-specific mechanism, but cheap insurance in the same boot.
      #   • exec-reject-smoke is the one smoke here whose OUTCOME differs by
      #     design: this IS the kernel that instruments (and can refuse) an exec
      #     image, so this is where its reject path is exercised for real — the
      #     `signals`-shard run of this same smoke, on NOMMU, only ever proves
      #     assertions 1/3/4 (see the smoke's own header comment). It runs ONLY
      #     here, not in the default nix-boot-smoke's `core` shard too — that would be a
      #     pure duplicate boot of the identical kernel+initramfs pair on a far
      #     more expensive runner for zero extra coverage.
      # ping-pace-probe stays the one non-gating diagnostic, same as `signals`.
      #
      # PROMOTED from soak to GATING (#131 soak-flip): all 10 smokes below
      # recorded a first-attempt green on .#kernel-mmu-a2 + .#wasm-initramfs-fork
      # in PR #184's CI run (job "boot guest + mmu-devices smokes",
      # 2026-08-05 — no panic-retries needed, whole shard in ~2.5 min), so per
      # the promotion rule in the parity plan each moves from the soak step's
      # `check` call to a real `run_smoke` hard gate. The soak-idiom rationale
      # (continue-on-error bounds FAILURE, step timeout-minutes bounds WALL
      # CLOCK, never a return-0 helper) lives in git history and
      # pr-preview.yml's preview-variant step comment (the default nix-boot-smoke no longer
      # has a soak step of its own — its one remaining soak smoke,
      # autotools-fork-smoke.mjs, was itself promoted to a hard gate on
      # 2026-08-13). The step-level timeout stays even though the step now gates: a hang
      # here should fail THIS step at a bounded point with its own name on it,
      # not surface as an anonymous job-level cancellation.
      - name: MMU device + async-signal smokes (#131, gating)
        timeout-minutes: 150
        working-directory: runtime
        env:
          LINUX_WASM_ARTIFACTS: file://${{ github.workspace }}/.artifacts-mmu-devices/
        run: |
          run_smoke() {
            local script="$1" attempt rc
            for attempt in 1 2 3; do
              echo "::group::$script (attempt $attempt)"
              set +e
              node "$script"
              rc=$?
              set -e
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -eq 2 ]; then
                echo "$script inconclusive (boot panic) — retrying"
                continue
              fi
              return "$rc"
            done
            echo "$script still inconclusive after 3 attempts"
            return 2
          }
          run_smoke demo/node/sigalrm-smoke.mjs
          run_smoke demo/node/kill-wake-smoke.mjs
          run_smoke demo/node/timeout-repro-smoke.mjs
          run_smoke demo/node/ping-pace-smoke.mjs

          echo "::group::ping-pace-probe matrix (#75 localizer, non-gating)"
          set +e
          node demo/node/ping-pace-probe-smoke.mjs
          set -e
          echo "::endgroup::"

          run_smoke demo/node/vsock-ctl-smoke.mjs
          run_smoke demo/node/resize-smoke.mjs
          run_smoke demo/node/snd-smoke.mjs
          run_smoke demo/node/clock-smoke.mjs
          # #179: this is the kernel where a rejected exec image actually gets
          # rejected — see the job header comment above.
          run_smoke demo/node/exec-reject-smoke.mjs
          run_smoke demo/node/blk-rw-smoke.mjs

  # --- nix-boot-smoke-nommu: bounded compatibility coverage ------------------
  # The former default full-system job now keeps the explicit NOMMU artifacts
  # healthy during their Phase-3 deprecation window. It remains the regression gate for the
  # virtio-device-enum patch fix: if patches 0017-0020 ever drop the 9P device
  # registration again (a silent patch-fuzz hazard the kernel.nix build-time
  # assertion already guards), `9pnet_virtio` finds "no channels available for
  # device yoreroot/nixcache" and this boot fails. smoke.mjs reads /mnt/yore (yoreroot
  # 9P) and runs `nix-env -iA make` (nixcache 9P substitution) — exercising BOTH
  # 9P channels end to end. Needs the four nix:true artifacts (kernel + initramfs +
  # base.squashfs + wasm-binary-cache); `needs: artifacts` so they are built +
  # pushed to Cachix first and this job substitutes them.
  nix-boot-smoke-nommu:
    name: NOMMU deprecation smoke (core + gtk)
    needs: [changes, toolchain, artifacts]
    # Run on a world OR engine change. `!failure() && !cancelled()` lets it run
    # when toolchain/artifacts were SKIPPED (runtime-only change) — it substitutes
    # the unchanged nix:true artifacts from Cachix rather than blocking on a build.
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.nix == 'true' || needs.changes.outputs.runtime == 'true') }}
    runs-on: namespace-profile-md
    # MERGED (CI perf pass): `core` and `gtk` used to be two parallel matrix
    # shards, each independently re-substituting the SAME nix:true artifact set
    # (kernel + initramfs + squashfs + the ~22 GiB wasm-binary-cache) — a
    # duplicate 10-25 min "Assemble nix:true artifacts" step every run, on top of
    # queueing separately for an `md` runner (real CI history showed 25-65 min
    # queue waits in this wave). Merging means the substitution happens ONCE and
    # both smoke groups reuse it. The browser gate moved to the MMU default job.
    # Keep the established budget for the core + GTK compatibility suite.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Disk free
        run: df -h /

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: nix-wasm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Assemble the nix:true artifact dir the harness reads (vmlinux.wasm,
      # initramfs.cpio.gz, base.squashfs, nix-cache/). nix-cache/ is the
      # .#wasm-binary-cache tree (served by nix-cache.js over file:// path fetches;
      # readFile follows the store symlinks).
      - name: Assemble nix:true artifacts (substitute from Cachix)
        run: |
          mkdir -p .artifacts-nix
          ln -sfn "$(nix build -L '.#kernel-nommu' --no-link --print-out-paths)/vmlinux.wasm" \
            .artifacts-nix/vmlinux.wasm
          ln -sfn "$(nix build -L '.#wasm-initramfs-nommu' --no-link --print-out-paths)/initramfs.cpio.gz" \
            .artifacts-nix/initramfs.cpio.gz
          ln -sfn "$(nix build -L '.#wasm-base-squashfs-nommu' --no-link --print-out-paths)/base.squashfs" \
            .artifacts-nix/base.squashfs
          ln -sfn "$(nix build -L '.#wasm-binary-cache' --no-link --print-out-paths)" \
            .artifacts-nix/nix-cache
          ls -lL .artifacts-nix

      - name: Install runtime deps
        working-directory: runtime
        run: bun install --frozen-lockfile

      # nix:true boots panic occasionally (exit 2) — retry; 0 pass / 1 fail are
      # terminal. Gating: a 9P-transport regression OR an install regression fails.
      - name: Boot full nix system + nix install smokes (core)
        working-directory: runtime
        env:
          LINUX_WASM_ARTIFACTS: file://${{ github.workspace }}/.artifacts-nix/
        run: |
          run_smoke() {
            local script="$1" attempt rc
            for attempt in 1 2 3; do
              echo "::group::$script (attempt $attempt)"
              set +e
              node "$script"
              rc=$?
              set -e
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -eq 2 ]; then echo "$script inconclusive (boot panic) — retrying"; continue; fi
              return "$rc"
            done
            echo "$script still inconclusive after 3 attempts"
            return 2
          }
          # 9P transport + legacy `nix-env -iA` substitution (reads /mnt/yore over
          # yoreroot 9P, installs make-wasm32 over nixcache 9P).
          run_smoke demo/node/smoke.mjs
          # The new CLI: `nix profile install` of a REAL-derivation catalog entry
          # substitutes its prebuilt output (issue #1 — substitute=true + .drv-aware
          # cache), then compiles + runs a C program. Gating.
          run_smoke demo/node/profile-install-e2e.mjs
          # `nix-env -iA` of the FULL toolchain (guest-clang-wasm32 + guest-cc +
          # guest-cxx) then COMPILES AND RUNS bare clang/clang++/cc/c++ → exit
          # 42/7. Gates two things the other smokes don't: (1) `nix-env -iA`
          # substituting a trivial (`allowSubstitutes = false`) derivation — needs
          # always-allow-substitutes in the guest nix.conf, else nix-env tries to
          # BUILD it and dies "platform mismatch" (#1 follow-up); (2) EXECUTING a
          # freshly-compiled wasm binary in the headless harness (issue #96). Gating.
          run_smoke demo/node/wrapperless-cc-e2e.mjs
          # BUILD derivations FROM SOURCE on the guest (issue #92), not just
          # substitute: a trivial sh-builder, a multi-util sh-builder (PATH=/bin),
          # and a derivation that compiles inline C with the in-guest toolchain →
          # then RUNS the from-source-built binary (exit 42). Proves nix's
          # local-derivation-goal (fork/exec a builder) works on NOMMU wasm via
          # posix_spawn. Gating.
          # #179 hardening, the case that matters: on the software MMU the
          # instrumentation pass REFUSES an image with no __get_tls_base, which used
          # to panic the guest ("Aiee, killing interrupt handler!"). Assert the task
          # dies alone and the shell survives. Boots nix:false, so it needs only
          # this job's vmlinux + initramfs.
          run_smoke demo/node/exec-reject-smoke.mjs
          run_smoke demo/node/build-from-source-e2e.mjs
          # M2/M3a graphics + FFI selftests (issue #88), batched into ONE boot
          # (display-free --selftest binaries baked into the image): glib (gobject +
          # libffi double marshaller), libffi (raw wasm backend), pango (cairo-ft
          # layout), wl-text (freetype/fontconfig/harfbuzz/cairo). Gating.
          run_smoke demo/node/selftests-batch.mjs
          # GNOME games tier: rsvg-convert renders mahjongg's real tileset SVG
          # to PNG in-guest — proves libcroco → librsvg → pango/cairo →
          # cairo-png headless, zero source patches. The game windows are
          # browser checks on the rig. Gating.
          run_smoke demo/node/rsvg-smoke.mjs

      - name: Boot full nix system + nix install smokes (gtk)
        working-directory: runtime
        env:
          LINUX_WASM_ARTIFACTS: file://${{ github.workspace }}/.artifacts-nix/
        run: |
          run_smoke() {
            local script="$1" attempt rc
            for attempt in 1 2 3; do
              echo "::group::$script (attempt $attempt)"
              set +e
              node "$script"
              rc=$?
              set -e
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -eq 2 ]; then echo "$script inconclusive (boot panic) — retrying"; continue; fi
              return "$rc"
            done
            echo "$script still inconclusive after 3 attempts"
            return 2
          }
            # The HEAVY GTK selftests (issue #88) run one-per-fresh-boot — batching
            # several ~14 MB GTK inits in one boot fragments the NOMMU heap and wedges
            # a later one (they pass fine isolated). gtk-hello (GTK3 type tree via the
            # fpcast seam, M3b), galculator (GTK3 .ui parse + widget class_init, M4),
            # gtk3-widget-factory (GtkBuilder add_callback_symbol autoconnect, #33),
            # gtk3-demo (full GtkApplication, signals wired in C — no GModule).
            # Gating; the retry wrapper covers boot-panic flakes (exit 2).
            run_smoke demo/node/gtk-smoke.mjs
            run_smoke demo/node/galculator-smoke.mjs
            run_smoke demo/node/widget-factory-smoke.mjs
            run_smoke demo/node/gtk-demo-smoke.mjs
            # gcalctool (classic GNOME calculator): computes 7*6=42 with gcalccmd,
            # the console front-end sharing the GUI's equation engine — a real
            # headless gate with no source patch. Light (no GTK init) but kept
            # one-per-boot with its GTK siblings for isolation. Gating.
            run_smoke demo/node/gcalctool-smoke.mjs
            # l3afpad (GTK3 leafpad fork, #122): the first real GTK3 productivity
            # app — signals wired in C, no GModule (the gtk3-demo posture).
            # --selftest class_inits the editor widgets through the fpcast seam +
            # fires a GtkTextBuffer signal, display-free. One-per-boot like its
            # GTK siblings. Gating.
            run_smoke demo/node/l3afpad-smoke.mjs
            # Xvfb (xorg-server 21.1.23, M-X1 of the XChat/X11 epic): boots the
            # cross X server headless (the vfb DDX needs no compositor), then
            # x11-probe (libxcb) reads back the connection setup. Proves the
            # posix_spawn Popen port (xkbcomp spawn) + the fpcast-emu pass on
            # the DIX device vtables, end to end. Gating.
            run_smoke demo/node/xvfb-smoke.mjs
            # xeyes/xwd/xdpyinfo (M-X2 of the XChat/X11 epic): the first real
            # X clients against Xvfb — a live xeyes window, xdpyinfo's server
            # query, and a `xwd -root` pixel dump verified host-side (XWD
            # header parse + non-flat pixel sampling). Gating.
            run_smoke demo/node/x11-apps-smoke.mjs
            # gtk2-hello (M-X4 of the XChat/X11 epic): GTK2 cross-built with
            # the X11 backend, the last structural layer before XChat itself
            # (M-X5). gtk2-smoke is the display-free headless gate (class_init
            # through the fpcast seam, gtk2-hello's own posture); gtk2-x11-smoke
            # is the live-window pixel proof (Xvfb + xwd, headless-
            # screenshottable — unlike GTK3's wayland backend, which needs a
            # real compositor this harness doesn't have). One-per-boot like
            # its GTK siblings. Gating.
            run_smoke demo/node/gtk2-smoke.mjs
            run_smoke demo/node/gtk2-x11-smoke.mjs
            # xchat (M-X5 of the XChat/X11 epic, the FINALE): XChat 2.8.8
            # over GTK2/X11. One boot: display-free --selftest (servlist
            # defaults + GTK2 class_init through fpcast) THEN a live main
            # window against Xvfb, xwd-verified like its GTK2/X11 siblings
            # above. One-per-boot like its GTK siblings. Gating.
            run_smoke demo/node/xchat-smoke.mjs

  # --- nix-boot-smoke: boot the shipped software-MMU/fork guest ----------------
  # This was issue #131's prove-then-flip job. Phase 3 promotes the exact proven
  # artifact set to the unsuffixed defaults; the historical proof notes below
  # remain because they explain why each expensive gate exists.
  #
  # This job assembles the shipped nix:true artifact set:
  #   • vmlinux    ← .#kernel (kernel-mmu-a2: CONFIG_MMU + A2 demand paging)
  #   • initramfs  ← .#wasm-initramfs (busybox-fork PID 1 + a fork bootstrap
  #                  that keeps hush as /bin/sh — no NOMMU forkshell-ash promotion)
  #   • squashfs   ← .#wasm-base-squashfs (#175): the base system with the
  #                  REAL-FORK nix.wasm + real-fork busybox. nix's OWN startProcess
  #                  spawns a builder via clone(CLONE_VM|CLONE_VFORK) on the default
  #                  build — that SIGSEGVs under the software MMU (the CLONE_VM child
  #                  gets a private page table, so the parent-mmap'd child stack is
  #                  unmapped in the child). The fork squashfs builds nix with
  #                  -DWASM_REAL_FORK so startProcess uses upstream fork()+exec over
  #                  muslFork's asyncify seam — real COW fork works here.
  #   • nix-cache  ← the SAME .#wasm-binary-cache (guest-cc is substituted, not
  #                  forked; unchanged). The engine software-MMU-instruments EVERY
  #                  exec'd binary at load (kernel-worker wasm_load_executable, gated
  #                  on the MMU kernel's nonzero pt_base).
  #
  # core + browser + gtk run sequentially in one job (CI perf pass — see the
  # job's own `timeout-minutes` comment for why).
  # `core` now runs every non-GTK
  # nix-boot-smoke smoke EXCEPT exec-reject-smoke — including the two nix-CLI
  # install paths (profile-install-e2e/wrapperless-cc-e2e) and rsvg-smoke.
  # exec-reject-smoke stays OUT of `core` on purpose: it boots nix:false
  # internally (no squashfs/nix-cache dependency), and `boot-smoke`'s
  # `mmu-devices` shard above already boots it on the IDENTICAL kernel+
  # initramfs pair (.#kernel-mmu-a2 + .#wasm-initramfs-fork) on a far cheaper
  # runner — running it again here would be a pure duplicate boot on this job's
  # -lg profile for zero extra coverage. `mmu-devices` is where "the rejection
  # actually happens" (the stale comment that used to sit on the NOMMU job's
  # exec-reject-smoke line — "the MMU job below runs the same smoke" — now
  # names that shard directly). `gtk` is new: the heavy one-per-fresh-boot GTK
  # apps, unexercised on the MMU/fork guest until now. Extending coverage here
  # is genuinely load-bearing, not just parity for its own sake — these are
  # exactly the memory-intensive binaries (#168's page-crossing corruption
  # class) most likely to expose a residual software-MMU bug that a
  # NOMMU-only pass can't see.
  #
  # SOAK NOTE (#131, CLOSED): the prove-then-flip soak ran its full course —
  # PR #184's first cycle recorded first-attempt greens for 18 of the 19 new
  # smoke invocations (promoted to hard gates then) and caught ONE real
  # finding: widget-factory-smoke failed because GModule autoconnect resolves
  # handlers by NAME via dlsym, and the ABI-8 dl host surface read its user
  # pointers RAW (correct on NOMMU where VA == offset, garbage under the
  # MMU's page tables). PR #186 fixed it engine-side (runtime/mmu-uaccess.js
  # host soft-uaccess walk + kernel-worker.js) and its soak recorded the
  # post-fix green — so widget-factory took the last promotion and EVERY
  # smoke in this job now hard-gates. The soak idiom's full rationale (why
  # `continue-on-error` + a step-level `timeout-minutes`, and why never a
  # return-0 helper like the reviewed-out `run_smoke_soft`) lives in git
  # history and pr-preview.yml's MMU-preview step comment.
  #
  # SECOND SOAK, 2026-08-05 parity-plan Phase-1 precondition (a DIFFERENT soak
  # from the #131 one closed above — that one's 19 smokes were done and
  # promoted long before this one had its first green): `demo/node/
  # autotools-fork-smoke.mjs`, the first automated regression gate anywhere
  # for CLAUDE.md's "In-guest autotools also works" milestone (a real
  # `./configure && make && ./prog` in the guest). It stayed non-gating while
  # issue #192 (a pre-existing kernel exec-image fragmentation bug — large
  # repeated execs, e.g. clang's driver+cc1, failing around the 6th with a
  # `page allocation failure: order:14`) made the fixture's own in-guest cc
  # invocations fail deterministically, unrelated to the shell/autoconf fixes
  # this smoke exists to prove. PR #199's per-inode exec-image cache (patch
  # 0030) fixed #192; the very next boot (workflow run 31697211801, job "boot
  # full nix system on software MMU (core," id 94455421162) recorded the
  # FIRST-EVER green CFGRC on attempt 1 (`CFGRC=0`, `MAKERC=0`,
  # `AUTOTOOLS_FIXTURE_OK`, `RUNRC=0`). CLOSED here: `autotools-fork-smoke.mjs`
  # is now a `run_smoke` call in the `core` hard-gates step below (see its own
  # comment) and the dedicated soak step is gone — there is nothing left to
  # soak in this job.
  nix-boot-smoke:
    name: boot default MMU/fork nix system (core + browser + gtk)
    needs: [changes, toolchain, artifacts]
    # Same changes-filter gating every sibling boot job uses (nix-boot-smoke,
    # boot-smoke): run on a world OR engine change, and don't block on
    # toolchain/artifacts having been SKIPPED (a runtime-only change substitutes
    # the unchanged MMU artifacts from Cachix instead of rebuilding).
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.nix == 'true' || needs.changes.outputs.runtime == 'true') }}
    # -lg (the LLVM-build profile) for RAM headroom: the real-fork nix.wasm is
    # whole-module-asyncified, and the software-MMU pass instrumenting it at load
    # produces multi-MB functions (helper-call-translated over V8's 6MB fn cap) —
    # loading it OOM-killed the -default runner (#175, exit 137). If it still OOMs
    # here, the whole-module asyncify doesn't scale to nix.wasm and needs bounding.
    # The `gtk` group doesn't load nix.wasm at all (its smokes never invoke `nix`),
    # but it DOES softmmu-instrument-at-load the same ~14 MB GTK binaries the
    # NOMMU gtk group's own comment says fragment a much smaller heap — kept on
    # the same -lg profile rather than assuming a smaller one is safe untested.
    runs-on: namespace-profile-lg
    # MERGED (CI perf pass): `core` and `gtk` used to be two parallel matrix
    # shards on `lg` — the scarcest, most contended runner profile (real CI
    # history showed a `gtk`-shard queue wait as long as 127 min in this exact
    # job). Both shards booted the SAME MMU nix:true artifact set
    # independently (kernel-mmu-a2 + wasm-initramfs-fork + wasm-base-squashfs-fork
    # + the ~22 GiB wasm-binary-cache), so merging removes one full duplicate
    # 15-25 min "Assemble MMU nix:true artifacts" substitution AND halves the
    # simultaneous `lg` demand this job generates every run. Budget below sums
    # the former per-shard step timeouts (`core`'s own well-documented 200-min
    # worst case, plus a smaller `gtk` allowance) rather than assuming shared
    # parallel time, since they now run sequentially in one job.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Disk free
        run: df -h /

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: nix-wasm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same nix:true layout as nix-boot-smoke, but the MMU kernel + fork initramfs.
      - name: Assemble MMU nix:true artifacts (substitute from Cachix)
        run: |
          mkdir -p .artifacts-nix-mmu
          ln -sfn "$(nix build -L '.#kernel' --no-link --print-out-paths)/vmlinux.wasm" \
            .artifacts-nix-mmu/vmlinux.wasm
          ln -sfn "$(nix build -L '.#wasm-initramfs' --no-link --print-out-paths)/initramfs.cpio.gz" \
            .artifacts-nix-mmu/initramfs.cpio.gz
          ln -sfn "$(nix build -L '.#wasm-base-squashfs' --no-link --print-out-paths)/base.squashfs" \
            .artifacts-nix-mmu/base.squashfs
          ln -sfn "$(nix build -L '.#wasm-binary-cache' --no-link --print-out-paths)" \
            .artifacts-nix-mmu/nix-cache
          ls -lL .artifacts-nix-mmu
          # 2026-08-05 parity-plan Phase-1 precondition (toolchain half): the
          # real-fork autotools acceptance fixture (userspace/autotools-fixture.nix)
          # — a plain, tiny (native-autoconf-only) source tree, so building it here
          # unconditionally costs nothing. Exported via $GITHUB_ENV so it's just
          # present in AUTOTOOLS_FIXTURE for the `core` smokes' autotools-fork-smoke
          # run_smoke call below, same as every other env var this job's steps
          # read. Capture into a variable FIRST (not `echo "X=$(nix build …)" >>
          # "$GITHUB_ENV"` directly) — piping the command substitution straight
          # into `echo` lets a `nix build` FAILURE be masked by `echo`'s own
          # (always-zero) exit status winning under `set -e`.
          fixture_path="$(nix build -L '.#autotools-fixture' --no-link --print-out-paths)"
          echo "AUTOTOOLS_FIXTURE=$fixture_path" >> "$GITHUB_ENV"
          # Hard gate (native, ~2 min): patches/busybox/0009+0010 make a
          # native busybox's hush run the fixture's real generated
          # `./configure && make && ./prog` to completion — see
          # userspace/autotools-fixture-hush-check.nix. A plain `nix build`;
          # its failure fails the job, same as any other build step. This is
          # proof for the same autotools chain only the `core` smokes'
          # autotools-fork-smoke gate exercises (the `gtk` smokes' display-free
          # GTK selftests never touch a shell at all), but it's cheap enough to
          # just always run once here rather than branch on it.
          nix build -L '.#autotools-fixture-hush-check' --no-link --print-out-paths

      - name: Install runtime deps
        working-directory: runtime
        run: bun install --frozen-lockfile

      # The MMU kernel is auto-detected by the engine (nonzero pt_base) — every
      # smoke below boots unmodified and the userspace is instrumented at load.
      # Retry a boot panic (exit 2); 0 pass / 1 fail are terminal. Split into two
      # steps (core, then gtk) instead of the former matrix-shard if/else, so
      # each keeps its own named, bounded step-level timeout. Every smoke in
      # this job now hard-gates here — see the SOAK NOTE + the SECOND SOAK note
      # in this job's header comment for the two promotion cycles that got it
      # there; no separate soak step remains.
      - name: Boot full nix system on MMU + core smokes — hard gates
        working-directory: runtime
        # 200: a promoted step keeps its own step-level wall-clock bound (the
        # convention this file follows elsewhere, e.g. the "MMU device +
        # async-signal smokes" step above) so a hang fails with ITS name on
        # it, not an anonymous job-level cancellation. Sized to the `core`
        # smokes' worst case: autotools-fork-smoke.mjs alone budgets up to 3
        # panic-retries at ~47m each internal budget (NIX_MAKE_TIMEOUT_MS
        # install 10m + CFGRC 25m + MAKERC 10m + boot/staging ~2m, per its own
        # comment history) ≈ 141m, plus the seven other `core` smokes (smoke,
        # build-from-source-e2e, selftests-batch, profile-install-e2e,
        # wrapperless-cc-e2e, exec-churn-smoke, rsvg-smoke) at a conservative
        # ~3m each ≈ 20m ⇒ ≈161m worst case — comfortably inside 200, and the
        # job-level 330 budget below leaves room for `gtk`'s step after it.
        timeout-minutes: 200
        env:
          LINUX_WASM_ARTIFACTS: file://${{ github.workspace }}/.artifacts-nix-mmu/
          # The software-MMU guest runs the substitute+unpack ~2-3x slower than
          # NOMMU (every access is a 2-level walk; page-crossing accesses split
          # byte-wise). Give smoke.mjs's `nix-env -iA make-wasm32` step a longer
          # budget than the shared 180s default so the (correct, slower) install
          # can finish. The NOMMU deprecation job keeps the 180s default.
          NIX_MAKE_TIMEOUT_MS: "600000"
        run: |
          run_smoke() {
            local script="$1" attempt rc
            for attempt in 1 2 3; do
              echo "::group::$script (attempt $attempt)"
              set +e
              node "$script"
              rc=$?
              set -e
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -eq 2 ]; then echo "$script inconclusive (boot panic) — retrying"; continue; fi
              return "$rc"
            done
            echo "$script still inconclusive after 3 attempts"
            return 2
          }
            # 9P transport + `nix-env -iA make` substitution — the same
            # end-to-end exercise as the NOMMU nix-boot-smoke, now on the
            # software-MMU guest. Previously the only smoke this job ran
            # (its core-only predecessor) — keeps hard-gating.
            run_smoke demo/node/smoke.mjs
            # #175 headline: nix's local-derivation-goal FORKS a builder
            # in-guest — the path that SIGSEGV'd on the clone-vfork nix.wasm
            # under the software MMU (a CLONE_VM child gets a private page
            # table, so the parent-mmap'd child stack is unmapped in the
            # child). With .#wasm-base-squashfs-fork (real-fork nix.wasm:
            # upstream fork()+exec over muslFork's asyncify seam) + the
            # wasm_collapse uncatchable-trap exec collapse (patch 0026 +
            # kernel-worker.js), the forked /bin/sh builder fork+execs and RUNS
            # on the real-COW-fork MMU guest (BUILD1/BUILD2). BUILD3 — the
            # deeper compile-with-guest-cc sub-case — is GATING here again as of
            # #179: the 57MB clang's SIGSEGV was never the softmmu translate, it
            # was a missing startup export (toolchain/guest-clang.nix drops
            # --export-all and its hand-written list lacked
            # __wasm_early_tp_init, so --gc-sections stripped the thread-pointer
            # seed and libc++'s ios_base::Init ctor stored `errno` through a
            # null struct pthread at VA 0x1c — fatal only under CONFIG_MMU).
            # Ran on this job's core-only predecessor — keeps hard-gating.
            run_smoke demo/node/build-from-source-e2e.mjs
            # #131 prove-then-flip, extending the MMU proof to the HEAVY layers
            # beyond the core 9P/install smoke: the M2/M3a graphics + FFI
            # selftests batched into ONE boot (glib gobject + the libffi
            # marshaller + pango cairo-ft layout + freetype/fontconfig/
            # harfbuzz). These are exactly the binaries most likely to expose a
            # residual software-MMU bug (the #168 page-crossing corruption was
            # found in nix.wasm; glib/libffi are just as memory-intensive), so
            # booting them under the per-access translate is a real
            # MMU-hardening gate. Same binaries the NOMMU nix-boot-smoke runs;
            # here they boot on .#kernel-mmu-a2, softmmu-instrumented at load.
            # Ran on this job's core-only predecessor — keeps hard-gating.
            run_smoke demo/node/selftests-batch.mjs
            # exec-reject-smoke is deliberately NOT run here — see this job's
            # header comment ("exec-reject-smoke stays OUT of `core`"):
            # boot-smoke's mmu-devices shard already boots it on the identical
            # kernel+initramfs pair for far less cost, and it boots nix:false
            # internally so this job's squashfs/nix-cache add nothing for it.
            # PROMOTED (#131 soak-flip): first-attempt greens recorded in PR
            # #184's soak cycle. The new CLI (`nix profile install`, issue #1)
            # via the shell-neutral primeLocalNixCache (the fork boot's /bin/sh
            # is busybox hush, no `~` expansion, unlike NOMMU's forkshell ash);
            run_smoke demo/node/profile-install-e2e.mjs
            # `nix-env -iA` of the toolchain + bare clang/clang++/cc/c++
            # compile+run → exit 42/7 — substitutes AND EXECS the 57 MB
            # guest-clang under this kernel, exercising the #179
            # startup-export contract (__wasm_early_tp_init seed);
            run_smoke demo/node/wrapperless-cc-e2e.mjs
            # #192: the targeted exec-fragmentation repro/regression gate —
            # 12 consecutive `clang hello.c -> ./a.out` cycles (>=24 large
            # execs, 4-5x past the observed 5th-7th-exec cliff) in one boot,
            # per-cycle exit-code assertions, and an assertion that the
            # order-14 warn_alloc signature never appears. Before patch 0030
            # (arch/wasm/mm/exec_image.c's refcounted per-inode exec-image
            # cache) this failed deterministically well before cycle 12 —
            # exactly the bug that kept the autotools-fork-smoke gate below
            # non-gating; that gate is the acceptance-level proof, THIS one
            # is the direct, targeted regression guard.
            run_smoke demo/node/exec-churn-smoke.mjs
            # 2026-08-05 parity-plan Phase-1 precondition — CLAUDE.md's
            # "In-guest autotools also works" milestone (a real `./configure
            # && make && ./prog` in the guest), the first automated
            # regression gate for it on ANY guest. Ran as a non-gating soak
            # here until #192 (the exec-fragmentation bug exec-churn-smoke
            # above regression-gates) made its own in-guest cc invocations
            # fail deterministically — unrelated to the shell/autoconf fixes
            # (patches/busybox/0009-0011) this smoke actually proves.
            # PROMOTED: PR #199's per-inode exec-image cache (patch 0030)
            # fixed #192, and the very next boot (workflow run 31697211801,
            # job "boot full nix system on software MMU (core," id
            # 94455421162) recorded the first-ever green CFGRC on attempt 1
            # (`CFGRC=0`, `MAKERC=0`, `AUTOTOOLS_FIXTURE_OK`, `RUNRC=0`) —
            # this hard-gates now, and the dedicated soak step is gone.
            run_smoke demo/node/autotools-fork-smoke.mjs
            # The GNOME-games tier render (rsvg-convert → libcroco → librsvg →
            # pango/cairo → cairo-png, headless).
            run_smoke demo/node/rsvg-smoke.mjs

      # Browser-only regressions (#137/#139) must gate the shipped default,
      # which is now this MMU/fork artifact set rather than the NOMMU
      # deprecation job above.
      - name: Install Chromium
        working-directory: runtime
        run: bunx playwright install --with-deps chromium

      - name: Browser boot + dlopen smoke
        working-directory: runtime
        run: |
          ln -sfn "${{ github.workspace }}/.artifacts-nix-mmu" demo/web/artifacts
          for attempt in 1 2; do
            echo "::group::browser smoke (attempt $attempt)"
            set +e
            node demo/web/smoke.mjs
            rc=$?
            set -e
            echo "::endgroup::"
            [ "$rc" -eq 0 ] && break
            echo "attempt $attempt failed (rc=$rc)"
            [ "$attempt" -eq 2 ] && exit 1
          done

      - name: Upload browser-smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshot
          path: runtime/demo/web/demo.png
          if-no-files-found: ignore

      - name: Boot full nix system on MMU + gtk smokes — hard gates
        working-directory: runtime
        # Smaller than `core`'s 200: no autotools-fork-smoke-class multi-retry
        # budget here, just six one-per-boot GTK selftests at a conservative
        # ~10m worst case (3x panic-retries) each ⇒ ≈60m. Generous headroom
        # kept anyway since this step runs after `core`'s inside the same
        # 330-min job budget.
        timeout-minutes: 90
        env:
          LINUX_WASM_ARTIFACTS: file://${{ github.workspace }}/.artifacts-nix-mmu/
        run: |
          run_smoke() {
            local script="$1" attempt rc
            for attempt in 1 2 3; do
              echo "::group::$script (attempt $attempt)"
              set +e
              node "$script"
              rc=$?
              set -e
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -eq 2 ]; then echo "$script inconclusive (boot panic) — retrying"; continue; fi
              return "$rc"
            done
            echo "$script still inconclusive after 3 attempts"
            return 2
          }
            # The HEAVY GTK selftests (issue #88) on the MMU/fork guest —
            # mirrors the NOMMU nix-boot-smoke gtk shard (same one-per-fresh-
            # boot rationale: batching several ~14 MB GTK inits fragments the
            # heap and wedges a later one). Exactly the class of memory-
            # intensive, gobject-fpcast-heavy binary the #168 page-crossing
            # corruption was found in, so these boots are real MMU-hardening
            # coverage. PROMOTED (#131 soak-flip, COMPLETE): five recorded
            # first-attempt greens in PR #184's soak cycle; widget-factory —
            # the cycle's one real finding (the ABI-8 dl surface reading user
            # pointers untranslated, fixed by runtime/mmu-uaccess.js) —
            # recorded its post-fix green in PR #186's soak and takes the
            # last promotion here. All six gate; no soak step remains in
            # this job (the soak idiom's rationale lives in git history and
            # pr-preview.yml's MMU-preview step comment).
            run_smoke demo/node/gtk-smoke.mjs

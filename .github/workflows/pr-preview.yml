name: Deploy PR preview

# Boots this PR's freshly-built guest in the browser. The deploy job builds the
# 3 boot artifacts (toolchain substituted from the nix-wasm Cachix cache),
# content-addresses them into cas/<buildhash>/, syncs the runtime/ frontend into
# pr-<N>/, and comments the URL. Teardown purges pr-<N>/ on close.
#
# It also builds + publishes a SECOND artifact set — the supported NOMMU guest —
# into its own cas/<hash>/ prefix, pointed at by preview.json's
# "variants.nommu" entry. Open it at `…/demo/web/?variant=nommu` (main.js reads
# the query param); the PR comment links it whenever that build succeeds. This is
# best-effort: a step-level
# timeout-minutes bounds its WALL CLOCK (a job-level timeout would cancel the
# whole job — including the "Comment preview link" step below — so
# continue-on-error alone is not enough; see the step's own comment) and
# continue-on-error bounds its FAILURE, so it never blocks the default preview
# above or the comment that announces it.
#
# pull_request_target (not pull_request) so the workflow runs from master's copy
# with secrets available. Unlike pc, this job EXECUTES PR build code (nix build),
# so the deploy job is fork-guarded to same-repo PRs (the repo is single-owner).
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PR: ${{ github.event.number }}
  PREVIEW_BUCKET: nix-wasm-previews
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_ACL: private

jobs:
  teardown:
    if: github.event.action == 'closed'
    runs-on: namespace-profile-sm
    steps:
      - name: Check provisioning
        id: cfg
        env:
          KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$KEY" ]; then echo "configured=true" >> "$GITHUB_OUTPUT";
          else echo "configured=false" >> "$GITHUB_OUTPUT"; echo "::notice::R2 secrets unset — skipping teardown."; fi
      - name: Install rclone
        if: steps.cfg.outputs.configured == 'true'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Purge pr-${{ env.PR }}/
        if: steps.cfg.outputs.configured == 'true'
        run: rclone purge "r2:${PREVIEW_BUCKET}/pr-${PR}" --s3-no-check-bucket --retries 1 --low-level-retries 1 --contimeout 15s || true
      - name: Comment teardown
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const marker = '<!-- nix-wasm-preview -->';
            const body = `${marker}\n🧹 Preview for this PR was torn down.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: process.env.PR });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });

  deploy:
    # Skip on close; skip fork PRs (their build code must never run with secrets).
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # lg, not md: this job has no `needs:` on nix-wasm.yml (separate workflow,
    # can't cross-file depend), so on a cold Cachix cache it races nix-wasm.yml's
    # `toolchain` job to build the SAME from-source guest-clang/kernel — and,
    # unlike that job, was doing so on the weaker `md` profile. Real CI history
    # showed this job's "Build + publish preview" step taking 65+ min in exactly
    # that race, vs. ~2 min once Cachix is warm. Matching nix-wasm.yml's `lg`
    # profile doesn't remove the race (only cross-workflow coordination would),
    # but it stops the preview from doing the same expensive build on
    # meaningfully slower hardware than its sibling.
    runs-on: namespace-profile-lg
    # 180 min covers the default MMU preview's steps alone (checkout through
    # "Comment preview link"), same as before the alternate variant was added;
    # the extra 60 is earmarked ENTIRELY for the NOMMU preview step below and
    # matches that step's own `timeout-minutes: 60` — so the NOMMU step can burn its
    # whole allotment and still leave the original 180 min budget intact for
    # everything else, incl. the comment step that must always get to run.
    timeout-minutes: 240
    steps:
      - name: Check provisioning
        id: cfg
        env:
          KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$KEY" ]; then echo "configured=true" >> "$GITHUB_OUTPUT";
          else echo "configured=false" >> "$GITHUB_OUTPUT"; echo "::notice::R2 secrets unset — skipping preview deploy. See infra/preview-worker/README.md."; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v27
        if: steps.cfg.outputs.configured == 'true'
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        if: steps.cfg.outputs.configured == 'true'
        with:
          name: nix-wasm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Install rclone
        if: steps.cfg.outputs.configured == 'true'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Build + publish preview
        if: steps.cfg.outputs.configured == 'true'
        env:
          PR_COMMIT: ${{ github.event.pull_request.head.sha }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: bash scripts/preview-publish.sh "${PR}"

      # NOMMU alternate-mode preview: the default build above is the software-
      # MMU/real-fork guest. Keep the NOMMU artifact set reachable under the
      # SAME three file names; baseUrl is the
      # only thing that differs. See main.js's `?variant=` handling. The nix-cache/ catalog
      # tree is intentionally NOT duplicated here — it's shared with (and outside
      # the scope of) the default preview per infra/preview-worker/README.md.
      #
      # This must not take down the already-working default-guest preview + its
      # PR comment below — it's additive alternate-mode coverage, not the headline
      # preview — which needs BOTH of:
      #   - continue-on-error: bounds FAILURE. A NOMMU-specific build break fails
      #     only this step; steps.nommu-preview.outcome (the pre-continue-on-error
      #     result) drives whether the comment links it.
      #   - timeout-minutes: bounds WALL CLOCK. continue-on-error does NOT save
      #     you from a cold Cachix cache forcing a from-source LLVM/kernel
      #     rebuild that runs long — that's a job-level timeout-minutes
      #     cancellation (the job budget above carries a +60 min allowance sized
      #     to exactly match this), which tears down the WHOLE job including the
      #     "Comment preview link" step below, continue-on-error or not. A
      #     step-level timeout instead fails just this step at a bounded point,
      #     which continue-on-error then does catch.
      - name: Build + publish NOMMU preview
        id: nommu-preview
        if: steps.cfg.outputs.configured == 'true'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set -euo pipefail

          # jq merges the nommu variant into preview.json below; cheap no-op if the
          # runner image already has it (standard on GH-hosted Ubuntu images, but
          # not guaranteed on every self-hosted profile).
          command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }

          echo "==> Building .#kernel-nommu …"
          KERNEL_OUT=$(nix build .#kernel-nommu --no-link --print-out-paths)
          echo "==> Building .#wasm-initramfs-nommu …"
          INITRD_OUT=$(nix build .#wasm-initramfs-nommu --no-link --print-out-paths)
          echo "==> Building .#wasm-base-squashfs-nommu …"
          SQUASH_OUT=$(nix build .#wasm-base-squashfs-nommu --no-link --print-out-paths)

          KERNEL="$KERNEL_OUT/vmlinux.wasm"
          INITRD="$INITRD_OUT/initramfs.cpio.gz"
          SQUASH="$SQUASH_OUT/base.squashfs"
          for f in "$KERNEL" "$INITRD" "$SQUASH"; do
            [ -f "$f" ] || { echo "ERROR: expected NOMMU artifact missing: $f" >&2; exit 1; }
          done

          # Same buildhash formula as scripts/preview-publish.sh, over the NOMMU
          # trio's own store-path basenames — a SEPARATE cas/ prefix from the
          # default set (different derivations ⇒ different basenames), so the
          # two never collide and --ignore-existing dedup still applies
          # build-to-build for each independently.
          BUILDHASH_NOMMU=$(printf '%s' "$(basename "$KERNEL_OUT")$(basename "$INITRD_OUT")$(basename "$SQUASH_OUT")" \
            | sha256sum | cut -c1-32)

          STAGE="$(mktemp -d)"
          cp "$KERNEL" "$STAGE/vmlinux.wasm"
          cp "$INITRD" "$STAGE/initramfs.cpio.gz"
          cp "$SQUASH" "$STAGE/base.squashfs"

          echo "==> rclone copy → cas/$BUILDHASH_NOMMU (skip-existing) …"
          rclone copy "$STAGE" "r2:${PREVIEW_BUCKET}/cas/$BUILDHASH_NOMMU" --ignore-existing \
            --s3-no-check-bucket --retries 3 --low-level-retries 3 --contimeout 15s --transfers 8 -v
          rm -rf "$STAGE"

          # Extend (never replace) the preview.json the step above just wrote:
          # read it back and merge in the nommu variant pointer. Deliberately does
          # NOT recompute the default artifactsBase's buildhash independently —
          # that formula belongs to scripts/preview-publish.sh alone; reading its
          # freshly-written answer avoids a second hand-kept copy of it drifting
          # out of sync (the CLAUDE.md startup-export-contract lesson: don't
          # duplicate a formula two places must agree on when one can just read
          # the other's output).
          CURRENT_JSON=$(rclone cat "r2:${PREVIEW_BUCKET}/pr-${PR}/demo/web/preview.json" \
            --s3-no-check-bucket --retries 3 --low-level-retries 3 --contimeout 15s)
          MERGED_JSON=$(printf '%s' "$CURRENT_JSON" | jq -c --arg base "/cas/$BUILDHASH_NOMMU/" \
            '.variants.nommu.artifactsBase = $base')

          echo "==> writing pr-${PR}/demo/web/preview.json (+ variants.nommu) …"
          printf '%s' "$MERGED_JSON" | rclone rcat "r2:${PREVIEW_BUCKET}/pr-${PR}/demo/web/preview.json" \
            --s3-no-check-bucket --retries 3 --low-level-retries 3 --contimeout 15s

          echo "nommu_buildhash=$BUILDHASH_NOMMU" >> "$GITHUB_OUTPUT"
          echo "==> PUBLISHED NOMMU preview pr-$PR  buildhash=$BUILDHASH_NOMMU"

      - name: Comment preview link
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/github-script@v7.0.1
        env:
          PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
          PR_COMMIT: ${{ github.event.pull_request.head.sha }}
          NOMMU_OUTCOME: ${{ steps.nommu-preview.outcome }}
        with:
          script: |
            const base = process.env.PREVIEW_BASE_URL;
            if (!base) { core.warning('PREVIEW_BASE_URL repo variable is unset'); return; }
            const url = `${base.replace(/\/+$/,'')}/pr-${process.env.PR}/demo/web/`;
            const marker = '<!-- nix-wasm-preview -->';
            const sha = (process.env.PR_COMMIT || '').slice(0, 8);
            // The supported NOMMU variant publishes to the SAME preview URL space
            // via preview.json's "variants" map — see main.js's `?variant=`
            // handling. Link it here only when its build
            // step actually succeeded (the step's continue-on-error + its own
            // timeout-minutes above mean a NOMMU-specific break OR a run that
            // outran its wall-clock budget never blocks this comment or the
            // default link).
            const nommuLine =
              process.env.NOMMU_OUTCOME === 'success'
                ? `\n<sub>NOMMU variant: ${url}?variant=nommu</sub>`
                : process.env.NOMMU_OUTCOME === 'failure'
                  ? `\n<sub>NOMMU variant: not published for this build (build failed or timed out).</sub>`
                  : '';
            const body = `${marker}\n🚀 **Preview ready:** ${url}\n\n<sub>Boots this PR's default MMU/fork guest (commit \`${sha}\`) in the browser · updated on every push.</sub>${nommuLine}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: process.env.PR });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: process.env.PR, body });
